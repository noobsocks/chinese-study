<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0B">
<title>汉 · 중국어 학습</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="汉">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;--surface:#141416;--surface2:#1C1C1F;--border:#26262A;
  --text:#F2F2F3;--muted:#8A8A8F;--faint:#5A5A60;
  --accent:#FF2442;--accent-soft:rgba(255,36,66,.12);
  --ok:#34C759;--ok-soft:rgba(52,199,89,.12);
  --t1:#F5C542;--t2:#5AC8FA;--t3:#34C759;--t4:#FF6B4A;--t0:#8A8A8F;
  --mono:'JetBrains Mono',monospace;--sans:'Pretendard','Pretendard Variable',-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.app{flex:1;display:flex;flex-direction:column;max-width:520px;margin:0 auto;width:100%;overflow:hidden;position:relative}
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:-.5px;font-size:15px;color:var(--muted)}
.logo b{color:var(--accent)}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.streak b{color:var(--text)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px;display:none;-webkit-overflow-scrolling:touch}
.view.active{display:flex;flex-direction:column}
.section-title{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin:24px 0 12px}

/* curriculum banner */
.banner{background:linear-gradient(135deg,#141018,var(--surface));border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;text-align:left;width:100%}
.banner .bt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.banner .bt h3{font-size:15px;font-weight:700}
.banner .bt .day{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.banner .bsub{font-size:13px;color:var(--muted);margin-bottom:12px}
.banner .gbar{height:6px}
.banner.empty{border-color:rgba(255,36,66,.3);text-align:center}
.banner.empty h3{font-size:16px;margin-bottom:4px}
.banner.empty p{font-size:13px;color:var(--muted);margin-bottom:14px}
.banner.empty .btn{width:auto;display:inline-block;padding:12px 28px}

/* home cards */
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;transition:transform .12s,border-color .15s;text-align:left;width:100%}
.hcard:active{transform:scale(.985);border-color:var(--faint)}
.hcard .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:var(--surface2)}
.hcard .tt{flex:1;min-width:0}
.hcard .tt h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
.hcard .tt p{font-size:13px;color:var(--muted);margin-top:2px}
.hcard .ar{color:var(--faint);font-size:20px}
.hcard.primary{background:linear-gradient(135deg,#1a1416,var(--surface));border-color:rgba(255,36,66,.25)}
.hcard.primary .ic{background:var(--accent-soft)}
.hcard .badge{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px}
.home-goal{margin:2px 0 16px}
.home-goal .gt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
.gbar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.gfill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1);width:0}

/* plan view */
.plan-choose{display:flex;flex-direction:column;gap:12px}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;text-align:left;width:100%;transition:transform .12s,border-color .15s}
.pc:active{transform:scale(.98)}
.pc.sel{border-color:var(--accent)}
.pc h3{font-size:20px;font-weight:700}
.pc h3 .u{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.pc p{font-size:13px;color:var(--muted);margin-top:4px}
.day-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.day-item .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.day-item .dh .dn{font-weight:700;font-size:15px}
.day-item .dh .ds{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:99px}
.day-item.past .dh .ds{color:var(--ok);background:var(--ok-soft)}
.day-item.today{border-color:var(--accent)}
.day-item.today .dh .ds{color:var(--accent);background:var(--accent-soft)}
.day-item.future{opacity:.55}
.day-item.future .dh .ds{color:var(--muted);background:var(--surface2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:15px;font-weight:600;background:var(--surface2);border-radius:8px;padding:4px 9px}
.chip small{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px;font-weight:400}

/* runner */
.runner,.planview{flex:1;display:none;flex-direction:column;min-height:0}
.runner.on,.planview.on{display:flex}
.rhead{display:flex;align-items:center;gap:12px;padding:2px 0 16px}
.rback{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rback:active{background:var(--surface2)}
.rtitle{font-size:16px;font-weight:700}
.rmini{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
#run-area{flex:1;display:flex;flex-direction:column;min-height:0}
#home-scroll{flex:1;display:flex;flex-direction:column}
.planview-scroll{flex:1;overflow-y:auto}

/* card shared */
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;min-height:0}
.qtype{position:absolute;top:20px;left:0;right:0;font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.hanzi{font-size:clamp(60px,16vw,100px);font-weight:600;line-height:1.05;letter-spacing:2px}
.pinyin{font-family:var(--mono);font-size:20px;margin-top:16px;letter-spacing:1px;font-weight:500}
.prompt-ko{font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.card-hint{font-size:13px;color:var(--faint);margin-top:14px}
.options{display:flex;flex-direction:column;gap:10px;padding:16px 0 0}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;font-size:18px;font-weight:500;text-align:left;transition:transform .12s,background .15s,border-color .15s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt .zh{font-size:22px;font-weight:600}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.opt.dim{opacity:.35}
.opt .mark{font-family:var(--mono);font-size:14px;font-weight:700;opacity:0}
.opt.correct .mark,.opt.wrong .mark{opacity:1}
.reveal{padding:14px 0 0;min-height:60px;display:flex;flex-direction:column;gap:10px}
.reveal .rv-pinyin{font-family:var(--mono);font-size:16px;text-align:center;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border-radius:16px;padding:16px;font-size:17px;font-weight:700;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4}
.center-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 20px}
.center-msg .big{font-size:52px}
.center-msg h2{font-size:22px;font-weight:700}
.center-msg p{color:var(--muted);font-size:15px;line-height:1.6;max-width:280px}

/* write */
.write-hint{text-align:center;margin-bottom:14px}
.write-hint .wm{font-size:26px;font-weight:700}
.write-hint .wp{font-family:var(--mono);font-size:16px;color:var(--muted);margin-top:6px}
.wboxes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;flex:1;align-items:center}
.wbox{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;width:128px;height:128px;overflow:hidden}
.wbox::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:1px;background:repeating-linear-gradient(0deg,var(--border),var(--border) 3px,transparent 3px,transparent 8px);transform:translateX(-.5px)}
.wbox::after{content:"";position:absolute;top:50%;left:8px;right:8px;height:1px;background:repeating-linear-gradient(90deg,var(--border),var(--border) 3px,transparent 3px,transparent 8px);transform:translateY(-.5px)}
.wbox.done{border-color:var(--ok)}
.wbox svg{position:relative;z-index:2}
.wtools{display:flex;gap:10px;padding:14px 0 0}
.wtools .btn{flex:1}
.wprog{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}

/* audio */
.playbtn{width:108px;height:108px;border-radius:50%;background:var(--accent);color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:transform .15s}
.playbtn:active{transform:scale(.94)}
.playbtn.small{width:64px;height:64px;font-size:26px;background:var(--surface2);color:var(--text)}
.speak-word{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.speak-word .sw-h{font-size:76px;font-weight:600;letter-spacing:2px}
.speak-word .sw-p{font-family:var(--mono);font-size:22px}
.speak-word .sw-m{font-size:18px;color:var(--muted)}
.grade-row{display:flex;gap:10px;padding:16px 0 0}
.grade-row .btn{flex:1}
.note-line{font-size:12px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.5}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}
.stat .n{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-1px}
.stat .n .u{font-size:15px;color:var(--muted);margin-left:3px}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.stat .accent{color:var(--accent)}.stat .green{color:var(--ok)}
.mastery-bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex;margin-top:6px}
.mastery-bar span{height:100%}
.legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend div{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.weak-item .zh{font-size:22px;font-weight:600}
.weak-item .zh small{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.weak-item .ko{font-size:14px;color:var(--muted)}
.weak-item .cnt{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.reset-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:12px;width:100%;font-size:13px;margin-top:8px}
.reset-btn:active{background:var(--surface2)}

/* words tab */
.wform{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:8px}
.wform label{font-size:12px;color:var(--muted);font-family:var(--mono);display:block;margin:10px 0 5px}
.wform label:first-child{margin-top:0}
.wform input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:16px}
.wform input:focus{outline:none;border-color:var(--accent)}
.wform .hintx{font-size:11px;color:var(--faint);margin-top:4px}
.wform .btn{margin-top:16px}
.word-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.word-row .l{display:flex;align-items:baseline;gap:10px}
.word-row .l .z{font-size:20px;font-weight:600}
.word-row .l .p{font-family:var(--mono);font-size:12px;color:var(--muted)}
.word-row .l .m{font-size:13px;color:var(--muted)}
.word-row .del{color:var(--faint);font-size:20px;padding:4px 8px}
.word-row .del:active{color:var(--accent)}

/* grammar */
.rule{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px}
.rule h3{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;gap:9px;align-items:baseline}
.rule h3 .num{font-family:var(--mono);color:var(--accent);font-size:13px;font-weight:700}
.rule p{font-size:14px;color:var(--muted);line-height:1.6}
.rule code{font-family:var(--mono);background:var(--surface2);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--text)}
.rule .ok-ex{color:var(--ok)}
.rule .no-ex{color:var(--accent);text-decoration:line-through;text-decoration-thickness:1px}

/* export */
.export-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:44vh;overflow-y:auto;margin-bottom:14px}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 4px calc(8px + var(--safe-b));max-width:520px;margin:0 auto;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:600;transition:color .15s}
.tab svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor}
.tab.active{color:var(--accent)}


.sent-ko{font-size:24px;font-weight:700;text-align:center;line-height:1.35;margin-bottom:6px}
.sent-rule{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px;margin-bottom:18px}
.ans-zone{min-height:56px;width:100%;border-bottom:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:8px;padding:8px 4px;align-content:flex-start;justify-content:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 0 0}
.tok{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 15px;font-size:20px;font-weight:600;transition:transform .1s}
.tok:active{transform:scale(.94)}
.tok.bank-tok{background:var(--surface);border-color:var(--faint)}
.gq-sent{font-size:30px;font-weight:700;letter-spacing:1px;line-height:1.3}
.opt.gq span:first-child{font-size:19px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.fade{animation:fade .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><b>汉</b> HÀN · 중국어</div>
    <div class="streak">🔥 <b id="streak">0</b>일</div>
  </header>

  <!-- LEARN -->
  <div class="view active" id="v-learn">
    <div id="home-scroll">
      <div id="banner-slot"></div>
      <div class="home-goal">
        <div class="gt"><span>오늘 학습</span><span id="goal-count">0 / 20</span></div>
        <div class="gbar"><div class="gfill" id="goal-fill"></div></div>
      </div>
      <button class="hcard primary" data-mode="mixed">
        <div class="ic">📚</div><div class="tt"><h3>오늘의 학습</h3><p>뜻·한자 4지선다 · 하루 20문제</p></div><div class="ar">›</div>
      </button>
      <div class="section-title">연습</div>
      <button class="hcard" data-mode="write"><div class="ic">✍️</div><div class="tt"><h3>한자 쓰기</h3><p>획순 따라쓰기 · 손가락으로 연습</p></div><div class="ar">›</div></button>
      <button class="hcard" data-mode="listen"><div class="ic">🎧</div><div class="tt"><h3>듣기</h3><p>소리 듣고 한자 고르기 · 자동 채점</p></div><div class="ar">›</div></button>
      <button class="hcard" data-mode="speak"><div class="ic">🗣️</div><div class="tt"><h3>말하기</h3><p>발음 듣고 따라 말하기</p></div><div class="ar">›</div></button>
      <button class="hcard" data-mode="sentence"><div class="ic">🧩</div><div class="tt"><h3>문장 만들기</h3><p>단어 순서 맞추기 · 어순 훈련</p></div><div class="ar">›</div></button>
      <button class="hcard" data-mode="gquiz"><div class="ic">📐</div><div class="tt"><h3>문법 퀴즈</h3><p>O/X·빈칸으로 약점 문법 점검</p></div><div class="ar">›</div></button>
      <button class="hcard" data-mode="review"><div class="ic">🔁</div><div class="tt"><h3>복습</h3><p>틀렸거나 복습할 단어만 모아서</p></div><div id="review-badge"></div><div class="ar">›</div></button>
      <div style="height:24px"></div>
    </div>

    <div class="runner" id="runner">
      <div class="rhead"><button class="rback" id="rback">‹</button><div class="rtitle" id="rtitle">학습</div><div class="rmini" id="rmini"></div></div>
      <div id="run-area"></div>
    </div>

    <div class="planview" id="planview">
      <div class="rhead"><button class="rback" id="pback">‹</button><div class="rtitle" id="ptitle">학습 플랜</div></div>
      <div class="planview-scroll" id="plan-area"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="view" id="v-stats">
    <div class="stats-grid">
      <div class="stat"><div class="n" id="s-learned">0<span class="u">개</span></div><div class="l">학습한 단어</div></div>
      <div class="stat"><div class="n green" id="s-mastered">0<span class="u">개</span></div><div class="l">완전 습득 (★5)</div></div>
      <div class="stat"><div class="n accent" id="s-acc">0<span class="u">%</span></div><div class="l">전체 정답률</div></div>
      <div class="stat"><div class="n" id="s-total">0<span class="u">회</span></div><div class="l">총 학습 횟수</div></div>
    </div>
    <div class="section-title">습득 단계 분포</div>

const KEY="han_srs_v1";let mem=null;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):fresh();}catch(e){return mem||(mem=fresh());}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){mem=s;}}
function fresh(){return{cards:{},streak:0,lastDay:null,totalAns:0,totalCor:0,todayCount:0,todayDate:null,custom:[],plan:null};}
let S=load();if(!S.custom)S.custom=[];
let LEX=[];function rebuildLex(){LEX=VOCAB.concat((S.custom||[]).map(c=>({h:c.h,p:c.p,m:c.m})));}rebuildLex();

const INTERVALS=[0,30*60e3,4*3600e3,24*3600e3,3*86400e3,10*86400e3];
const GOAL=20;const now=()=>Date.now();const today=()=>new Date().toISOString().slice(0,10);
function cardState(h){return S.cards[h]||(S.cards[h]={box:0,due:0,seen:0,cor:0,wr:0});}
function rollDay(){const t=today();if(S.todayDate!==t){S.todayDate=t;S.todayCount=0;}
  if(S.lastDay!==t){const y=new Date(Date.now()-86400e3).toISOString().slice(0,10);
    if(S.lastDay===y)S.streak=(S.streak||0)+1;else S.streak=1;S.lastDay=t;}}
function grade(h,correct){const st=cardState(h);st.seen++;S.totalAns++;
  if(correct){st.cor++;S.totalCor++;st.box=Math.min(st.box+1,5);if(navigator.vibrate)navigator.vibrate(8);}
  else{st.wr++;st.box=0;if(navigator.vibrate)navigator.vibrate([10,40,10]);}
  st.due=now()+INTERVALS[st.box];S.todayCount++;rollDay();save(S);updateGoal();return st;}
function gradeMisc(correct){S.totalAns++;if(correct)S.totalCor++;S.todayCount++;rollDay();save(S);updateGoal();}

/* ===== 커리큘럼 ===== */
function planActive(){return !!(S.plan&&S.plan.track);}
function chunks(track){const arr=VOCAB,len=arr.length,out=[];let idx=0;
  for(let i=0;i<track;i++){const cnt=Math.round((len-idx)/(track-i));out.push(arr.slice(idx,idx+cnt));idx+=cnt;}return out;}
function planDay(){if(!planActive())return 0;
  const d=Math.floor((Date.parse(today())-Date.parse(S.plan.start))/86400e3)+1;
  return Math.max(1,Math.min(S.plan.track,d));}
function planUnlocked(){const ch=chunks(S.plan.track);let u=[];for(let i=0;i<planDay();i++)u=u.concat(ch[i]);
  return u.concat((S.custom||[]).map(c=>({h:c.h,p:c.p,m:c.m})));}
function planTodayWords(){return chunks(S.plan.track)[planDay()-1]||[];}
function startPlan(track){S.plan={track,start:today()};save(S);updateHome();switchPanel('home');toast(track+'일 과정 시작! 📅');}
function resetPlan(){if(confirm('학습 플랜을 해제할까요?')){S.plan=null;save(S);updateHome();switchPanel('home');}}

/* 성조 */
const TONE_MAP={'āēīōūǖ':1,'áéíóúǘ':2,'ǎěǐǒǔǚ':3,'àèìòùǜ':4};
function toneOf(s){for(const ch of s){for(const set in TONE_MAP)if(set.includes(ch))return TONE_MAP[set];}return 0;}
function colorPinyin(p){return (p||'').split(' ').map(s=>`<span class="t${toneOf(s)}">${s}</span>`).join(' ');}

/* TTS */
let zhVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/^zh/i.test(v.lang))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);
  u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}

/* 획순 데이터 로더: 내장 우선, 없으면 CDN */
function charLoader(ch,onComplete){
  if(window.HANZI_DATA&&window.HANZI_DATA[ch]){onComplete(window.HANZI_DATA[ch]);return;}
  fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(ch)+'.json')
    .then(r=>r.json()).then(d=>{window.HANZI_DATA[ch]=d;onComplete(d);}).catch(()=>onComplete(null));
}

/* ===== 카드 선택 ===== */
function learnPool(){return planActive()?planUnlocked():LEX;}
function pickCard(pool){const n=now();const src=pool&&pool.length?pool:learnPool();
  const seen=src.filter(v=>S.cards[v.h]);
  const due=seen.filter(v=>S.cards[v.h].due<=n).sort((a,b)=>S.cards[a.h].due-S.cards[b.h].due);
  if(due.length)return due[0];
  const fr=src.filter(v=>!S.cards[v.h]);
  if(fr.length)return fr[(Math.random()*fr.length)|0];
  return seen.sort((a,b)=>S.cards[a.h].box-S.cards[b.h].box)[0]||src[0];}
function reviewPool(){const base=planActive()?planUnlocked():LEX;
  return base.filter(v=>S.cards[v.h]&&(S.cards[v.h].wr>0||S.cards[v.h].box<3));}

/* MC */
function renderMC(){answered=false;

  cur=pickCard(pool);const mode=Math.random()<.5?'mean':'hanzi';

/* 쓰기 */
let W_chars=[];
function renderWrite(){
  const pool=learnPool().filter(v=>[...v.h].every(c=>window.HANZI_DATA&&window.HANZI_DATA[c])&&[...v.h].length<=3);
  cur=pickCard(pool.length?pool:learnPool());W_chars=[...cur.h];
  runArea().innerHTML=`<div class="card fade" style="padding:24px 16px">
      <div class="write-hint"><div class="wm">${cur.m}</div><div class="wp">${colorPinyin(cur.p)}</div></div>
      <div class="wprog" id="wprog">획순을 따라 써보세요 · 1 / ${W_chars.length}</div>
      <div class="wboxes" id="wboxes">${W_chars.map((c,i)=>`<div class="wbox" id="wb${i}"></div>`).join('')}</div></div>
    <div class="wtools"><button class="btn ghost" id="w-demo">획순 보기</button><button class="btn ghost" id="w-hide">힌트 숨기기</button><button class="btn ghost" id="w-skip">건너뛰기</button></div>
    <div class="reveal" id="reveal"></div>`;
  const writers=W_chars.map((c,i)=>HanziWriter.create('wb'+i,c,{width:118,height:118,padding:6,showOutline:true,
    strokeColor:'#F2F2F3',outlineColor:'#3a3a40',drawingColor:'#FF2442',drawingWidth:22,
    strokeAnimationSpeed:1.2,delayBetweenStrokes:70,charDataLoader:charLoader}));
  let idx=0,miss=0;
  function quizChar(){if(idx>=W_chars.length){finishWrite(miss);return;}
    document.getElementById('wprog').textContent=`획순을 따라 써보세요 · ${idx+1} / ${W_chars.length}`;
    writers[idx].quiz({showHintAfterMisses:3,onMistake:()=>{miss++;},
      onComplete:()=>{document.getElementById('wb'+idx).classList.add('done');idx++;setTimeout(quizChar,250);}});}
  document.getElementById('w-demo').onclick=()=>writers[idx]&&writers[idx].animateCharacter();
  document.getElementById('w-skip').onclick=()=>finishWrite(99);
  let hid=false;document.getElementById('w-hide').onclick=()=>{hid=!hid;writers.forEach(w=>hid?w.hideOutline():w.showOutline());document.getElementById('w-hide').textContent=hid?'힌트 보이기':'힌트 숨기기';};
  quizChar();}
function finishWrite(miss){const ok=miss<=W_chars.length+1;const st=grade(cur.h,ok);
  const star='★'.repeat(st.box)+'☆'.repeat(5-st.box);
  document.getElementById('reveal').innerHTML=`<div class="rv-pinyin" style="color:${ok?'var(--ok)':'var(--muted)'}">${ok?'잘했어요! ✍️':'연습 완료'} · ${cur.h} ${star}</div><button class="btn" id="next-btn">다음 →</button>`;
  document.getElementById('next-btn').onclick=nextItem;}

function renderListen(){answered=false;cur=pickCard();

/* 문장 만들기 */
let curSent=null,sBank=[],sAns=[];
function renderSentence(){curSent=SENTENCES[(Math.random()*SENTENCES.length)|0];sAns=[];sBank=shuffle(curSent.t.slice());paintSentence();}
function paintSentence(locked){
  runArea().innerHTML=`<div class="card fade" style="justify-content:flex-start;padding-top:34px">
      <div class="qtype">문장 만들기</div><div class="sent-ko">${curSent.ko}</div>
      <div class="sent-rule">${curSent.rule}</div><div class="ans-zone" id="ans"></div></div>
    <div class="bank" id="bank"></div>
    <div class="reveal" id="reveal"><button class="btn" id="check" ${sAns.length&&!locked?'':'disabled'}>확인</button></div>`;
  const ans=document.getElementById('ans'),bank=document.getElementById('bank');
  sAns.forEach((tk,i)=>{const b=document.createElement('button');b.className='tok';b.textContent=tk;
    if(!locked)b.onclick=()=>{sBank.push(tk);sAns.splice(i,1);paintSentence();};ans.appendChild(b);});
  sBank.forEach((tk,i)=>{const b=document.createElement('button');b.className='tok bank-tok';b.textContent=tk;
    if(!locked)b.onclick=()=>{sAns.push(tk);sBank.splice(i,1);paintSentence();};bank.appendChild(b);});
  const chk=document.getElementById('check');if(chk&&!locked){chk.disabled=!sAns.length;chk.onclick=checkSentence;}}
function checkSentence(){const ok=sAns.join('')===curSent.t.join('');gradeMisc(ok);paintSentence(true);
  document.getElementById('reveal').innerHTML=`<div class="rv-pinyin" style="color:${ok?'var(--ok)':'var(--accent)'}">${ok?'정답! ✓':'다시 보기'} · ${curSent.t.join('')}</div>

/* 통계 */
function renderStats(){const seen=LEX.filter(v=>S.cards[v.h]);const learned=seen.length;
  const mastered=seen.filter(v=>S.cards[v.h].box>=5).length;const acc=S.totalAns?Math.round(S.totalCor/S.totalAns*100):0;
  document.getElementById('s-learned').innerHTML=learned+'<span class="u">개</span>';
  document.getElementById('s-mastered').innerHTML=mastered+'<span class="u">개</span>';
  document.getElementById('s-acc').innerHTML=acc+'<span class="u">%</span>';
  document.getElementById('s-total').innerHTML=S.totalAns+'<span class="u">회</span>';
  const total=LEX.length;const b12=seen.filter(v=>S.cards[v.h].box>=1&&S.cards[v.h].box<=2).length;
  const b34=seen.filter(v=>S.cards[v.h].box>=3&&S.cards[v.h].box<=4).length;const b5=mastered;
  const unseen=total-learned+seen.filter(v=>S.cards[v.h].box===0).length;
  const seg=(nn,c)=>nn?`<span style="width:${nn/total*100}%;background:${c}"></span>`:'';
  document.getElementById('mastery-bar').innerHTML=seg(unseen,'var(--surface2)')+seg(b12,'var(--t4)')+seg(b34,'var(--t1)')+seg(b5,'var(--ok)');
  const weak=seen.filter(v=>S.cards[v.h].wr>0).sort((a,b)=>S.cards[b.h].wr-S.cards[a.h].wr).slice(0,6);
  document.getElementById('weak-list').innerHTML=weak.length?weak.map(v=>`<div class="weak-item"><div><span class="zh">${v.h}<small>${v.p}</small></span></div>
    <div style="display:flex;align-items:center;gap:14px"><span class="ko">${v.m}</span><span class="cnt">${S.cards[v.h].wr}회</span></div></div>`).join('')
    :`<p style="color:var(--faint);font-size:14px">아직 틀린 단어가 없어요 👏</p>`;}

/* 단어 관리 */
function renderWords(){const list=document.getElementById('mywords');const cw=S.custom||[];
  document.getElementById('mywords-title').textContent=`내가 추가한 단어 (${cw.length})`;
  list.innerHTML=cw.length?cw.map((w,i)=>`<div class="word-row"><div class="l"><span class="z">${w.h}</span>
    <span class="p">${w.p||''}</span><span class="m">${w.m}</span></div><button class="del" data-i="${i}">✕</button></div>`).join('')
    :`<p style="color:var(--faint);font-size:14px">위 폼에서 단어를 추가하면 여기에 쌓여요. 모든 학습 모드에 바로 반영돼요.</p>`;
  list.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(confirm(`'${cw[i].h}' 삭제할까요?`)){S.custom.splice(i,1);save(S);rebuildLex();renderWords();updateHome();}});}
document.getElementById('add-btn').onclick=()=>{
  const h=document.getElementById('in-h').value.trim();
  const p=document.getElementById('in-p').value.trim();
  const m=document.getElementById('in-m').value.trim();
  if(!h||!m){toast('한자와 뜻은 필수예요');return;}
  if(VOCAB.some(v=>v.h===h)||(S.custom||[]).some(v=>v.h===h)){toast('이미 있는 단어예요');return;}
  S.custom.push({h,p,m});save(S);rebuildLex();
  document.getElementById('in-h').value='';document.getElementById('in-p').value='';document.getElementById('in-m').value='';
  renderWords();updateHome();toast(`'${h}' 추가됨 ✓`);};

/* 문법/내보내기 */
function renderGrammar(){document.getElementById('grammar-list').innerHTML=RULES.map((r,i)=>`
  <div class="rule"><h3><span class="num">${String(i+1).padStart(2,'0')}</span>${r[0]}</h3><p>${r[1]}</p></div>`).join('');}
function renderExport(){const seen=LEX.filter(v=>S.cards[v.h]);const learned=seen.length;
  const mastered=seen.filter(v=>S.cards[v.h].box>=5).length;const acc=S.totalAns?Math.round(S.totalCor/S.totalAns*100):0;
  const weak=seen.filter(v=>S.cards[v.h].wr>0).sort((a,b)=>S.cards[b.h].wr-S.cards[a.h].wr).slice(0,10).map(v=>`${v.h}(${v.p}, ${v.m}) ${S.cards[v.h].wr}회`);
  const notYet=LEX.filter(v=>!S.cards[v.h]||S.cards[v.h].box<3).map(v=>v.h);
  const planLine=planActive()?`${S.plan.track}일 과정 · Day ${planDay()}/${S.plan.track}`:'없음';
  const txt=`[중국어 학습 이어받기 — HÀN 앱에서 내보냄]
날짜: ${today()}
연속 학습: ${S.streak||0}일 · 플랜: ${planLine}

■ 진도
- 학습한 단어: ${learned} / ${LEX.length}개
- 완전 습득(★5): ${mastered}개
- 전체 정답률: ${acc}% (총 ${S.totalAns}회)

■ 자주 틀린 단어 (집중 복습)
${weak.length?weak.map(w=>'- '+w).join('\n'):'- 없음'}

■ 아직 약한 단어 (★3 미만)
${notYet.length?notYet.join(' '):'없음'}

■ 반복되는 문법 약점
- 太…了 세트 · 了 위치 · 주어 혼동 · 동음자(和/喝, 新/心)

■ 요청
위 약점 단어·문법을 섞어 듀오링고 스타일 5문제 라운드 시험. 한자쓰기 힌트 없이, 병음 성조는 tong(2)xue(2) 형식.`;
  document.getElementById('export-box').textContent=txt;return txt;}

/* 탭 */
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');document.querySelector(`.tab[data-v="${v}"]`).classList.add('active');
  if(v==='learn')switchPanel('home');if(v==='stats')renderStats();if(v==='words')renderWords();
  if(v==='grammar')renderGrammar();if(v==='export')renderExport();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.v));
document.getElementById('copy-btn').onclick=async()=>{const txt=renderExport();
  try{await navigator.clipboard.writeText(txt);toast('복사됐어요 📋');}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('복사됐어요 📋');}catch(_){toast('길게 눌러 복사하세요');}document.body.removeChild(ta);}};
document.getElementById('reset-btn').onclick=()=>{if(confirm('모든 학습 기록을 지울까요? (추가한 단어·플랜 포함) 되돌릴 수 없어요.')){
  S=fresh();save(S);rebuildLex();renderStats();updateHome();toast('초기화됐어요');}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

rollDay();save(S);updateHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
