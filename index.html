<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4CAF3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HÀN 단어장</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="hanzi-data.js"></script>
<script src="hanzi-writer.min.js"></script>
<style>
:root{
  --bg:#FAF9F6;--surface:#FFFFFF;--surface2:#F3F1EC;--border:#EAE7E0;
  --text:#2A2A2E;--muted:#7C7A74;--faint:#B8B4AB;
  --accent:#4CAF3F;--accent-d:#3E9433;--accent-soft:rgba(76,175,63,.12);
  --wrong:#E5533C;
  --t1:#C98A00;--t2:#2E86C1;--t3:#2E9E5B;--t4:#DD5A3A;--t0:#9AA0A6;
  --mono:'JetBrains Mono',monospace;--sans:'Pretendard',-apple-system,sans-serif;--disp:'Space Grotesk',var(--sans);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:9px}
.logo .mark{width:30px;height:30px;background:var(--accent);color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 2px 0 var(--accent-d)}
.logo .wm{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.4px}
.logo .wm small{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted);margin-left:6px}
.htools{display:flex;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(28px + var(--safe-b));display:none}
.view.on{display:block}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* HOME */
.addbtn{width:100%;background:var(--accent);color:#fff;border:none;border-bottom:4px solid var(--accent-d);border-radius:16px;padding:15px;font-size:16px;font-weight:800;font-family:var(--sans);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn:active{transform:translateY(2px);border-bottom-width:2px}
.addbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;font-size:15px;color:var(--text);margin-bottom:14px;font-family:var(--sans)}
.search:focus{outline:none;border-color:var(--accent)}
.day-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 17px;margin-bottom:10px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 3px 12px rgba(60,50,30,.045)}
.day-card:active{transform:scale(.99)}
.dc-badge{font-family:var(--disp);font-weight:700;font-size:15px;color:#fff;background:var(--accent);min-width:52px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dc-mid{flex:1;min-width:0}
.dc-t{font-size:15px;font-weight:700;color:var(--text)}
.dc-c{font-size:12px;color:var(--muted);margin-top:2px}
.dc-ar{color:var(--faint);font-size:20px}
.sec-title{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--muted);margin:6px 2px 10px}

/* DAY */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.day-h{font-family:var(--disp);font-size:17px;font-weight:700}
.hide-ctrl{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:14px}
.hide-ctrl button{flex:1;padding:8px 4px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);font-family:var(--sans)}
.hide-ctrl button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.wcard{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(60,50,30,.04)}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cell{cursor:pointer;line-height:1.35}
.cell.zi{font-size:23px;font-weight:700;letter-spacing:1px}
.cell.py{font-family:var(--mono);font-size:13px}
.cell.mn{font-size:14px;color:var(--muted)}
.cell.hidden{filter:blur(7px);opacity:.9}
.cell.hidden.reveal{filter:none}
.cell.hidden::after{}
.wc-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.mini{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mini:active{background:var(--accent-soft);color:var(--accent)}
.mini svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quiz-cta{width:100%;background:var(--surface);color:var(--accent);border:2px solid var(--accent);border-bottom-width:4px;border-radius:15px;padding:14px;font-size:15px;font-weight:800;font-family:var(--sans);margin:6px 0 4px}
.quiz-cta:active{transform:translateY(2px);border-bottom-width:2px}

/* PASTE */
.paste-in{width:100%;height:44vh;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:14px;font-family:var(--mono);color:var(--text);line-height:1.6;resize:none}
.paste-in:focus{outline:none;border-color:var(--accent)}
.help{background:var(--surface2);border-radius:13px;padding:13px 15px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.help code{font-family:var(--mono);color:var(--accent);font-weight:600}

/* QUIZ */
.q-ko{font-size:20px;font-weight:700;text-align:center;margin:10px 0 4px}
.q-hint{text-align:center;font-size:12px;color:var(--faint);margin-bottom:16px}
.slots{min-height:52px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;border-bottom:2px dashed var(--border);padding-bottom:14px;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--surface);border:1px solid var(--border);border-bottom:3px solid var(--border);border-radius:11px;padding:9px 14px;font-size:18px;font-weight:600}
.tok:active{transform:translateY(1px)}
.tok.used{opacity:.25;pointer-events:none}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-bottom:4px solid var(--accent-d);border-radius:15px;padding:14px;font-size:16px;font-weight:800;font-family:var(--sans);margin-top:18px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--surface2);color:var(--text);border-bottom-color:var(--border)}
.q-reveal{text-align:center;margin-top:16px;font-size:15px}
.q-reveal .py{font-family:var(--mono);font-size:13px;display:block;margin-top:4px}

/* STROKE OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov.on{display:flex}
.ov-card{background:var(--bg);border-radius:22px;padding:22px;width:100%;max-width:360px;text-align:center}
.ov-card h3{font-family:var(--disp);font-size:16px;margin-bottom:12px}
#stroke-target{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ov-card{max-width:400px}
.sv-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sv-title{font-size:30px;font-weight:700;line-height:1}
.sv-sub{font-size:12px;color:var(--muted);flex:1;line-height:1.4}
.sv-x{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:14px;color:var(--muted);border:none;flex-shrink:0}
.sv-boxwrap{display:flex;justify-content:center;margin-bottom:16px}
#stroke-box{background:var(--surface);border:2px solid var(--border);border-radius:16px;
  background-image:linear-gradient(90deg,transparent calc(50% - .5px),var(--border) 50%,transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),var(--border) 50%,transparent calc(50% + .5px)),linear-gradient(45deg,transparent calc(50% - .5px),var(--surface2) 50%,transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--surface2) 50%,transparent calc(50% + .5px))}
.sv-ctrls{display:flex;gap:8px}
.sv-btn{flex:1;padding:13px 6px;border:none;border-radius:13px;background:var(--surface2);color:var(--text);font-size:14px;font-weight:700;font-family:var(--sans);border-bottom:3px solid var(--border)}
.sv-btn:active{transform:translateY(2px);border-bottom-width:1px}
.sv-btn.primary{background:var(--accent);color:#fff;border-bottom-color:var(--accent-d)}

/* tones */
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark">汉</span><span class="wm">HÀN<small>단어장</small></span></div>
  <div class="htools">
    <button class="iconbtn" id="rate-btn" title="발음 속도"><svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></button>
  </div>
</header>
<div id="app">
  <div class="view on" id="v-home">
    <button class="addbtn" id="add-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>붙여넣기로 단어 추가</button>
    <input class="search" id="search" placeholder="한자·병음·뜻 검색">
    <div id="search-res"></div>
    <div class="sec-title" id="days-label">학습일</div>
    <div id="day-list"></div>
  </div>

  <div class="view" id="v-day">
    <div class="topbar"><button class="back" data-to="home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="day-h" id="day-title">Day</div></div>
    <div class="hide-ctrl" id="hide-ctrl">
      <button data-h="none" class="on">모두 보기</button>
      <button data-h="h">한자 가리기</button>
      <button data-h="p">병음 가리기</button>
      <button data-h="m">뜻 가리기</button>
    </div>
    <button class="quiz-cta" id="quiz-btn">📝 예문 문제 풀기</button>
    <div id="cards"></div>
  </div>

  <div class="view" id="v-paste">
    <div class="topbar"><button class="back" data-to="home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="day-h">단어 추가</div></div>
    <div class="help">아래 형식으로 붙여넣으면 새 <b>Day</b>로 등록돼요.<br>
    <code>[Day 16] 제목</code><br><code>한자 | 병음 | 뜻</code> (한 줄에 하나)<br><code># 예문</code> 아래 <code>중국어 | 한국어</code></div>
    <textarea class="paste-in" id="paste-in" placeholder="[Day 16] 새 단어
好 | hǎo | 좋다
# 예문
你好吗 | 잘 지내?"></textarea>
    <button class="btn" id="paste-do">등록하기</button>
  </div>

  <div class="view" id="v-quiz">
    <div class="topbar"><button class="back" id="quiz-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="day-h" id="quiz-title">예문 문제</div></div>
    <div id="quiz-area"></div>
  </div>
</div>

<div class="ov" id="stroke-ov"><div class="ov-card">
  <div class="sv-top"><div class="sv-title" id="stroke-h">字</div><div class="sv-sub" id="stroke-sub"></div><button class="sv-x" id="stroke-close">✕</button></div>
  <div class="sv-boxwrap"><div id="stroke-box"></div></div>
  <div class="sv-ctrls">
    <button class="sv-btn" id="stroke-anim">획순 보기</button>
    <button class="sv-btn" id="stroke-redo">다시</button>
    <button class="sv-btn primary" id="stroke-next">다음 →</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

function fresh(){return{days:[],rate:0.75,hide:'none'};}
let S;try{S=JSON.parse(localStorage.getItem('han-notebook'))||fresh();}catch(e){S=fresh();}
if(!S.days)S.days=[];if(S.rate==null)S.rate=0.75;if(!S.hide)S.hide='none';
function save(){try{localStorage.setItem('han-notebook',JSON.stringify(S));}catch(e){}}
function allDays(){return BUILTIN.concat(S.days);}
function allWords(){const w=[];allDays().forEach(d=>d.words.forEach(x=>w.push(x)));return w;}

/* tones */
function toneOf(s){if(/[āēīōūǖ]/.test(s))return 1;if(/[áéíóúǘ]/.test(s))return 2;if(/[ǎěǐǒǔǚ]/.test(s))return 3;if(/[àèìòùǜ]/.test(s))return 4;return 0;}
function colorPinyin(p){return (p||'').split(' ').map(s=>`<span class="t${toneOf(s)}">${s}</span>`).join(' ');}

/* TTS */
let voices=[];function loadVoices(){voices=speechSynthesis.getVoices()||[];}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=S.rate;
  const v=voices.find(x=>/zh|chinese|中文|普通话/i.test(x.lang+x.name));if(v)u.voice=v;
  speechSynthesis.speak(u);}

/* nav */
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  const el=document.getElementById('v-'+id);el.classList.add('on','fade');el.scrollTop=0;
  setTimeout(()=>el.classList.remove('fade'),260);}

/* HOME */
function renderHome(){const box=document.getElementById('day-list');
  box.innerHTML=allDays().map((d,i)=>`<button class="day-card" data-i="${i}"><span class="dc-badge">Day ${i+1}</span><span class="dc-mid"><span class="dc-t">${d.title}</span><span class="dc-c">${d.words.length}단어${d.sents&&d.sents.length?' · 예문 '+d.sents.length:''}</span></span><span class="dc-ar">›</span></button>`).join('');
  box.querySelectorAll('.day-card').forEach(b=>b.onclick=()=>openDay(+b.dataset.i));}

/* SEARCH */
function renderSearch(q){const box=document.getElementById('search-res'),lbl=document.getElementById('days-label'),list=document.getElementById('day-list');
  q=(q||'').trim().toLowerCase();
  if(!q){box.innerHTML='';lbl.style.display='';list.style.display='';return;}
  lbl.style.display='none';list.style.display='none';
  const res=allWords().filter(w=>w[0].includes(q)||(w[1]||'').toLowerCase().includes(q)||w[2].toLowerCase().includes(q)).slice(0,60);
  box.innerHTML=res.length?res.map(w=>`<div class="wcard"><div class="cells"><div class="cell zi">${w[0]}</div><div class="cell py">${colorPinyin(w[1])}</div><div class="cell mn">${w[2]}</div></div><div class="wc-btns"><button class="mini spk" data-h="${w[0]}"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button></div></div>`).join(''):'<p class="empty">결과가 없어요.</p>';
  box.querySelectorAll('.spk').forEach(b=>b.onclick=()=>speak(b.dataset.h));}

/* DAY */
let curDay=0;
function openDay(i){curDay=i;const d=allDays()[i];
  document.getElementById('day-title').textContent=`Day ${i+1} · ${d.title}`;
  document.querySelectorAll('#hide-ctrl button').forEach(b=>b.classList.toggle('on',b.dataset.h===S.hide));
  renderCards();showView('day');}
function renderCards(){const d=allDays()[curDay],box=document.getElementById('cards');
  box.innerHTML=d.words.map(w=>{
    const hz=`<div class="cell zi ${S.hide==='h'?'hidden':''}">${w[0]}</div>`;
    const py=`<div class="cell py ${S.hide==='p'?'hidden':''}">${colorPinyin(w[1])}</div>`;
    const mn=`<div class="cell mn ${S.hide==='m'?'hidden':''}">${w[2]}</div>`;
    return `<div class="wcard"><div class="cells">${hz}${py}${mn}</div><div class="wc-btns">
      <button class="mini spk" data-h="${w[0]}"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button>

  box.querySelectorAll('.wr').forEach(b=>b.onclick=()=>openStroke(b.dataset.h));}
document.querySelectorAll('#hide-ctrl button').forEach(b=>b.onclick=()=>{S.hide=b.dataset.h;save();
  document.querySelectorAll('#hide-ctrl button').forEach(x=>x.classList.toggle('on',x===b));renderCards();});

/* STROKE */
let strokeChars=[],strokeIdx=0,strokeWriter=null;
function openStroke(word){strokeChars=[...word].filter(c=>window.HANZI_DATA&&window.HANZI_DATA[c]);
  if(!strokeChars.length){toast('이 글자는 획순 데이터가 없어요');return;}
  strokeIdx=0;document.getElementById('stroke-ov').classList.add('on');drawStroke();}
function drawStroke(){const ch=strokeChars[strokeIdx],box=document.getElementById('stroke-box');box.innerHTML='';
  document.getElementById('stroke-h').textContent=ch;
  document.getElementById('stroke-sub').textContent=strokeChars.length>1?`${strokeIdx+1} / ${strokeChars.length}번째 글자 · 손가락으로 따라 쓰세요`:'손가락으로 획순대로 따라 쓰세요';
  const size=Math.min(window.innerWidth-72,300);box.style.width=size+'px';box.style.height=size+'px';
  strokeWriter=HanziWriter.create(box,ch,{width:size,height:size,padding:12,showCharacter:false,showOutline:true,
    strokeColor:'#2A2A2E',outlineColor:'#DDD9D0',drawingColor:'#4CAF3F',drawingWidth:26,
    strokeAnimationSpeed:1.1,delayBetweenStrokes:160,
    charDataLoader:(c,onC)=>onC(window.HANZI_DATA[c])});
  strokeWriter.quiz({onComplete:()=>{if(strokeIdx<strokeChars.length-1){setTimeout(()=>{strokeIdx++;drawStroke();},650);}else setTimeout(()=>toast('완성! 👏'),250);}});
  document.getElementById('stroke-next').textContent=strokeIdx<strokeChars.length-1?'다음 글자 →':'닫기';}
function closeStroke(){document.getElementById('stroke-ov').classList.remove('on');}
document.getElementById('stroke-anim').onclick=()=>{if(strokeWriter)strokeWriter.animateCharacter();};
document.getElementById('stroke-redo').onclick=()=>drawStroke();
document.getElementById('stroke-next').onclick=()=>{if(strokeIdx<strokeChars.length-1){strokeIdx++;drawStroke();}else closeStroke();};
document.getElementById('stroke-close').onclick=closeStroke;
document.getElementById('stroke-ov').onclick=e=>{if(e.target.id==='stroke-ov')closeStroke();};

/* QUIZ */
let quizPool=[],quizIdx=0,curSent=null,sAns=[],sBank=[];
function tokenize(cn){const dict=allWords().map(w=>w[0]).filter(x=>x&&/[\u4e00-\u9fff]/.test(x)).sort((a,b)=>b.length-a.length);
  const t=[];let i=0;while(i<cn.length){let m=null;for(const w of dict){if(cn.startsWith(w,i)){m=w;break;}}if(m){t.push(m);i+=m.length;}else{t.push(cn[i]);i++;}}return t;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function dayQuizPool(){const vocab=new Set();allDays().slice(0,curDay+1).forEach(d=>d.words.forEach(w=>vocab.add(w[0])));
  let pool=SENTS.slice();
  allDays().slice(0,curDay+1).forEach(d=>(d.sents||[]).forEach(s=>pool.push({t:tokenize(s[0]),ko:s[1]})));
  return pool.filter(s=>s.t.filter(t=>vocab.has(t)).length>=s.t.length-2);}
function openQuiz(){quizPool=shuffle(dayQuizPool());
  if(!quizPool.length){toast('이 Day엔 예문 문제가 아직 없어요');return;}
  quizIdx=0;document.getElementById('quiz-title').textContent=`Day ${curDay+1} 예문`;showView('quiz');nextQuiz();}
function nextQuiz(){if(quizIdx>=Math.min(quizPool.length,8))return quizDone();
  curSent=quizPool[quizIdx];sAns=[];sBank=shuffle(curSent.t.slice());paintQuiz();}
function paintQuiz(){const a=document.getElementById('quiz-area');
  a.innerHTML=`<div class="q-ko">${curSent.ko}</div><div class="q-hint">${quizIdx+1} / ${Math.min(quizPool.length,8)} · 단어를 순서대로 배열하세요</div>
    <div class="slots" id="slots"></div><div class="bank" id="bank"></div><button class="btn" id="q-check">확인</button><div id="q-foot"></div>`;
  paintTokens();document.getElementById('q-check').onclick=checkQuiz;}
function paintTokens(){const slots=document.getElementById('slots'),bank=document.getElementById('bank');
  slots.innerHTML=sAns.map((t,i)=>`<button class="tok" data-i="${i}">${t}</button>`).join('');
  bank.innerHTML=sBank.map((t,i)=>`<button class="tok ${sAns.indexOf(t)>=0&&countIn(sAns,t)>=countIn(sBank.slice(0,i+1),t)?'used':''}" data-t="${i}">${t}</button>`).join('');
  slots.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{sAns.splice(+b.dataset.i,1);paintTokens();});
  bank.querySelectorAll('.tok:not(.used)').forEach(b=>b.onclick=()=>{sAns.push(sBank[+b.dataset.t]);paintTokens();});}
function countIn(arr,v){return arr.filter(x=>x===v).length;}
function checkQuiz(){if(!sAns.length){toast('단어를 배열하세요');return;}const ok=sAns.join('')===curSent.t.join('');
  const cb=document.getElementById('q-check');if(cb)cb.style.display='none';
  const foot=document.getElementById('q-foot');
  foot.innerHTML=`<div class="q-reveal" style="color:${ok?'var(--accent)':'var(--wrong)'}">${ok?'정답! 👏':'정답: '+curSent.t.join(' ')}</div><button class="btn" id="q-next">${quizIdx>=Math.min(quizPool.length,8)-1?'완료':'다음 →'}</button>`;
  document.getElementById('q-next').onclick=()=>{quizIdx++;nextQuiz();};
  document.querySelectorAll('#slots .tok,#bank .tok').forEach(t=>t.style.pointerEvents='none');}
function quizDone(){document.getElementById('quiz-area').innerHTML=`<div class="q-ko" style="margin-top:40px">예문 연습 완료! 🎉</div><button class="btn" id="q-home" style="max-width:280px;margin:20px auto 0;display:block">Day로 돌아가기</button>`;
  document.getElementById('q-home').onclick=()=>showView('day');}
document.getElementById('quiz-btn').onclick=openQuiz;
document.getElementById('quiz-back').onclick=()=>showView('day');

/* PASTE */
function parsePaste(txt){const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  let title='새 단어';const words=[],sents=[];let mode='w';
  for(const ln of lines){const mt=ln.match(/^\[?\s*Day\s*\d+\s*\]?\s*(.*)$/i);
    if(mt&&/day/i.test(ln)){if(mt[1])title=mt[1];continue;}
    if(/^#\s*예문/.test(ln)){mode='s';continue;}
    const p=ln.split('|').map(x=>x.trim());
    if(mode==='w'){if(p.length>=3&&p[0])words.push([p[0],p[1],p[2]]);}
    else{if(p.length>=2&&p[0])sents.push([p[0],p[1]]);}}
  if(!words.length)return null;return{title,words,sents};}
document.getElementById('add-btn').onclick=()=>showView('paste');
document.getElementById('paste-do').onclick=()=>{const txt=document.getElementById('paste-in').value;
  const d=parsePaste(txt);if(!d){toast('형식을 확인해주세요 (한자 | 병음 | 뜻)');return;}
  S.days.push(d);save();document.getElementById('paste-in').value='';
  renderHome();showView('home');toast(`Day ${allDays().length} 등록됨 · ${d.words.length}단어`);};

/* misc */
document.querySelectorAll('.back[data-to]').forEach(b=>b.onclick=()=>showView(b.dataset.to));
document.getElementById('search').oninput=e=>renderSearch(e.target.value);
document.getElementById('rate-btn').onclick=()=>{const r=[0.6,0.75,1.0];S.rate=r[(r.indexOf(S.rate)+1)%r.length]||0.75;save();toast('발음 속도 '+S.rate+'x');};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
